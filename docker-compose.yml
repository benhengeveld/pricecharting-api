services:
    pricecharting-api:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "3000:3000"
        environment:
            - API_KEY=${API_KEY}
            - PRICE_CHARTING_API_KEY=${PRICE_CHARTING_API_KEY}
            - PRICECHARTING_TIMEOUT=${PRICECHARTING_TIMEOUT}
        volumes:
            - cache-data:/app/.cache
        restart: unless-stopped

volumes:
    cache-data:
